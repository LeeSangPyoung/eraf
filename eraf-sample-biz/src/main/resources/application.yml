server:
  port: 8080

spring:
  application:
    name: eraf-sample-biz
  cloud:
    compatibility-verifier:
      enabled: false

  # Thymeleaf
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

  # H2 Database (for development)
  datasource:
    url: jdbc:h2:mem:eraf_sample;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Redis (when available)
  data:
    redis:
      host: localhost
      port: 6379

  # Kafka (when available)
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: eraf-sample-group
      auto-offset-reset: earliest

# ERAF Configuration
eraf:
  # Core
  core:
    enabled: true

  # Security
  security:
    enabled: true
    disable-csrf: true
    disable-frame-options: true
    permit-all-patterns:
      - /actuator/**
      - /api/**
      - /h2-console/**
      - /error
      - /favicon.ico
      - /**
    jwt:
      enabled: false
      secret: ${JWT_SECRET:eraf-sample-secret-key-for-development-only-change-in-production}
      expiration: 3600

  # Session
  session:
    enabled: true
    timeout: 1800

  # Saga
  saga:
    enabled: true
    api-enabled: true
    api-path: /api/saga

  # State Machine
  statemachine:
    enabled: true

  # Notification (Mock)
  notification:
    enabled: true
    mock: true

  # Scheduler
  scheduler:
    enabled: true

  # Batch
  batch:
    enabled: true

  # Phase 2: Request Context (eraf-web)
  web:
    request-context:
      enabled: true
      trace-id-header: X-Trace-Id
      request-id-header: X-Request-Id

  # Phase 2: JPA Enhancements (eraf-data-jpa)
  jpa:
    envers:
      enabled: true
    audit-retention:
      enabled: true
      retention-days: 365
      hard-delete-enabled: true
      hard-delete-after-days: 730
      cron: "0 0 2 * * ?"
      hard-delete-cron: "0 0 3 * * SUN"

  # Phase 2: Actuator Enhancements (eraf-actuator)
  actuator:
    health:
      liveness:
        enabled: true
      readiness:
        enabled: true
        startup-delay-seconds: 10

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: '*'  # Phase 2: Expose all endpoints for demo/development
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true  # Phase 2: Enable Kubernetes probes
  health:
    livenessstate:
      enabled: true  # Phase 2: Liveness probe
    readinessstate:
      enabled: true  # Phase 2: Readiness probe
    elasticsearch:
      enabled: false
    rabbit:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}  # Phase 2: Add application tag to all metrics
    distribution:
      percentiles-histogram:
        http.server.requests: true  # Phase 2: Enable histogram for HTTP requests

# Logging
logging:
  level:
    com.eraf: DEBUG
    org.springframework.web: INFO
  pattern:
    # Phase 2: Include MDC (requestId, traceId, userId) in logs
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{requestId}] [%X{traceId}] [%X{userId}] - %msg%n'
