server:
  port: 8080

spring:
  application:
    name: eraf-sample-biz
  cloud:
    compatibility-verifier:
      enabled: false

  # Thymeleaf
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

  # H2 Database (for development)
  datasource:
    url: jdbc:h2:mem:eraf_sample;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Redis (when available)
  data:
    redis:
      host: localhost
      port: 6379

  # Kafka (when available)
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: eraf-sample-group
      auto-offset-reset: earliest

# ERAF Configuration
eraf:
  # Core
  core:
    enabled: true

  # Security
  security:
    enabled: true
    disable-csrf: true
    disable-frame-options: true
    permit-all-patterns:
      - /actuator/**
      - /api/**
      - /h2-console/**
      - /error
      - /favicon.ico
      - /**
    jwt:
      enabled: false
      secret: ${JWT_SECRET:eraf-sample-secret-key-for-development-only-change-in-production}
      expiration: 3600

  # Session
  session:
    enabled: true
    timeout: 1800

  # Saga
  saga:
    enabled: true
    api-enabled: true
    api-path: /api/saga

  # State Machine
  statemachine:
    enabled: true

  # Notification (Mock)
  notification:
    enabled: true
    mock: true

  # Scheduler
  scheduler:
    enabled: true

  # Batch
  batch:
    enabled: true

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    com.eraf: DEBUG
    org.springframework.web: INFO
